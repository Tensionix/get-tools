      - id: driver_packages
        section: "drivers"
        visible_when:
          vendor: "uupdump"
          uup_view: "drivers"
        type: "checkboxes"
        label: "This machine's drivers: tick, press Export drivers, the packages land in output\\Drivers"
        label_ru: "Драйверы этой машины: отметьте, нажмите «Экспорт драйверов», пакеты лягут в output\\Drivers"
        tooltip: "Every third-party driver package of this machine (in-box Microsoft ones are not listed). Class, original inf name, provider and version on each card. The network classes are ticked when the list opens, only the newest version of each driver; 'Select block' and 'Clear block' take the whole list."
        tooltip_ru: "Все сторонние пакеты драйверов этой машины (встроенные драйверы Microsoft не показываются). На карточке класс, исходное имя inf, поставщик и версия. Сетевые классы отмечены при открытии, только новейшая версия каждого драйвера; «Отметить блок» и «Снять блок» берут весь список."
        default: []
        min_selected: 1
        filter: true
        grid_min_px: 320
        options_source: "system_core.services.vendor_service:machine_driver_options"
        cache_seconds: 300
      - id: vendor_pick
        section: "versions"
        type: "profile_buttons"
        hidden_when:
          vendor: "uupdump"
          uup_view: ["apps", "drivers"]
        label: "Pick"
        label_ru: "Выбрать"
        tooltip: "Ticks version cards by rule instead of by hand. Latest stable: the newest final release, betas and Insider builds skipped. Portable: only the portable builds and zips stay in the list, press again for the installers. Golden: every starred card. Clear: nothing ticked."
        tooltip_ru: "Отмечает карточки версий по правилу, а не руками. Последняя стабильная: самый новый финальный выпуск, беты и Insider пропускаются. Портативные: в списке остаются только портативные сборки и zip, повторное нажатие возвращает установщики. Золотые: все карточки со звездой. Снять: ничего не отмечено."
        presets:
          - id: "pick_latest_stable"
            label: "Latest stable"
            label_ru: "Последняя стабильная"
            tooltip: "The newest final release; betas, previews and Insider builds are skipped."
            tooltip_ru: "Самый новый финальный выпуск; беты, preview и Insider пропускаются."
            pick:
              vendor_versions: "latest_stable"
          - id: "portable_only"
            label: "Portable"
            label_ru: "Портативные"
            tooltip: "Portable mode: the list keeps only the versions that have a portable build or zip, and a tick now means that file, the one behind the crimson archive icon. Ticks you already made move to the portable file of the same version. Press again for the installers. An empty list means the product has no portable build."
            tooltip_ru: "Режим портативных: в списке остаются только версии, у которых есть портативная сборка или zip, и отметка теперь значит этот файл, тот, что за багровым значком архива. Уже сделанные отметки переходят на портативный файл той же версии. Повторное нажатие возвращает установщики. Пустой список значит, что портативной сборки у продукта нет."
            visible_when:
              vendor: "techpowerup"
            toggle:
              vendor_portable_only: true
          - id: "pick_golden"
            label: "★ Golden"
            label_ru: "★ Золотые"
            tooltip: "Every starred card. NVIDIA: the drivers marked golden in config\\vendor_nvidia.yaml. Windows: the newest build of each generation, 22H2, 24H2, 25H2 and so on, with its latest cumulative update; the rest of a generation is history."
            tooltip_ru: "Все карточки со звездой. NVIDIA: драйверы, помеченные золотыми в config\\vendor_nvidia.yaml. Windows: новейшая сборка каждого поколения, 22H2, 24H2, 25H2 и так далее, со свежим накопительным обновлением; остальное в поколении это история."
            visible_when:
              vendor: ["nvidia", "uupdump"]
            pick:
              vendor_versions: "golden"
          - id: "pick_none"
            label: "Clear"
            label_ru: "Снять"
            tooltip: "No card ticked."
            tooltip_ru: "Ни одна карточка не отмечена."
            pick:
              vendor_versions: "none"
      - id: vendor_portable_only
        section: "versions"
        type: "checkbox"
        hidden: true
        label: "Portable builds only"
        label_ru: "Только портативные"
        tooltip: "The Portable button of the pick row: while on, the version list keeps only versions with a portable build and a tick means that file. Counts on the TechPowerUp tab only."
        tooltip_ru: "Кнопка «Портативные» ряда выбора: пока включена, в списке версий остаются только версии с портативной сборкой, и отметка значит этот файл. Действует только на вкладке TechPowerUp."
        default: false
        visible_when:
          vendor: "techpowerup"
      - id: vendor_versions
        section: "versions"
        type: "checkboxes"
        hidden_when:
          vendor: "uupdump"
          uup_view: ["apps", "drivers"]
        label: "Versions"
        label_ru: "Версии"
        tooltip: "Every version the vendor has for this product and platform, newest first. Tick the ones to fetch, or use the buttons on a card for that one build; the filter box narrows the list. On a card the green arrow fetches the installer, the crimson archive icon fetches the portable build or zip of the same version, the blue link only prints the download link; an empty slot means the version has no such file."
        tooltip_ru: "Все версии продукта для этой платформы у производителя, новые сверху. Отметьте нужные или нажмите кнопки на карточке ради одной сборки; поле фильтра сужает список. На карточке зелёная стрелка качает установщик, багровый значок архива качает портативную сборку или zip той же версии, синяя ссылка только выводит адрес; пустое место значит, что такого файла у версии нет."
