        tooltip: "The generation the driver must support. One driver file usually covers several generations; the list shows what NVIDIA publishes for the chosen one, so the oldest version here is the oldest that still runs those chips. 'My cards' keeps only the versions published for every generation named in config\\vendor_nvidia.yaml. GTX 700 and 600 end with the 47x branch, GTX 500 and 400 with the last driver 391.35: NVIDIA files it under Windows 10, it installs on Windows 11 all the same."
        tooltip_ru: "Поколение, которое драйвер обязан поддерживать. Один файл драйвера обычно закрывает несколько поколений; список показывает то, что NVIDIA публикует для выбранного, так что самая старая версия здесь это самая старая, ещё работающая с этими чипами. «Мои карты» оставляет только версии, выпущенные для всех поколений из config\\vendor_nvidia.yaml. GTX 700 и 600 закрыты веткой 47x, GTX 500 и 400 последним драйвером 391.35: NVIDIA числит его под Windows 10, на Windows 11 он ставится так же."
