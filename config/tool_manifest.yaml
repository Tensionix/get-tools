        title_ru: "LLM-планирование"
        description: "Provider, model, key and prompt controls for package planning."
        description_ru: "Провайдер, модель, ключ и prompt для планирования пакетов."
        fields: *ai_llm_fields
        children:
          - id: ai_plan_packages
            title: "Build plan"
            title_ru: "Собрать план"
            description: "Ask the selected LLM for suggestions and validate candidate IDs with WinGet search."
            description_ru: "Запросить предложения у выбранной LLM и проверить кандидаты через WinGet search."
            service: "system_core.services.winget_ai_service:run_ai_package_planner"
            kind: "safe"
            fields:
              - id: package_request
                section: "request"
                type: "textarea"
                label: "AI task"
                label_ru: "Задача для AI"
                tooltip: "What to find or prepare right now: an app name, a software stack, or a user task. Required for building an AI plan."
                tooltip_ru: "Что нужно найти или подготовить сейчас: название программы, набор софта или пользовательская задача. Это обязательное поле для сборки AI-плана."
                default: "Подготовь Windows-машину для Dev/Media: Git, VS Code, Python, FFmpeg, OBS, HandBrake, LosslessCut, 7-Zip."
                rows: 3
                span: "full"
              - id: include_installed_scan
                section: "generation"
                type: "checkbox"
                label: "Scan installed IDs"
                label_ru: "Сканировать установленные ID"
                tooltip: "Before planning, read installed WinGet IDs so the LLM can avoid suggesting what is already present."
                tooltip_ru: "Перед планированием прочитать установленные WinGet ID, чтобы LLM не предлагала уже установленное."
                default: true
                span: "half"
              - id: include_known_packages
                section: "generation"
                type: "checkbox"
                label: "Send Audion known package groups"
                label_ru: "Передать известные группы Audion"
                tooltip: "Give the LLM Audion's curated package groups as context for better suggestions."
                tooltip_ru: "Передать LLM кураторские группы пакетов Audion как контекст для более точных предложений."
                default: true
                span: "half"
              - id: search_limit
                section: "generation"
                type: "number"
                label: "Search candidates"
                label_ru: "Кандидатов поиска"
                tooltip: "Maximum WinGet search candidates collected per proposed package."
                tooltip_ru: "Сколько кандидатов WinGet search собирать для каждого предложенного пакета."
                default: 5
                min: 1
                max: 20
                step: 1

          - id: ai_check_model
            title: "Check model"
            title_ru: "Проверить модель"
            description: "Send one tiny request and cache selected model status."
            description_ru: "Отправить короткий запрос и сохранить статус выбранной модели."
            service: "system_core.services.winget_ai_service:run_ai_package_control"
            kind: "safe"
            parameters:
              mode: "check_model"

          - id: ai_pin_api_key
            title: "Favorite API key"
            title_ru: "Закрепить API key"
            description: "Save selected provider key reference as a favorite. Does not store key material in cache."
            description_ru: "Закрепить ссылку на ключ провайдера. Сам ключ в кэш не записывается."
            service: "system_core.services.winget_ai_service:run_ai_package_control"
            kind: "safe"
            parameters:
              mode: "pin_api_key"

          - id: ai_pin_model
            title: "Favorite model"
            title_ru: "Закрепить модель"
            description: "Save selected provider model as a favorite."
            description_ru: "Закрепить выбранную модель провайдера."
            service: "system_core.services.winget_ai_service:run_ai_package_control"
            kind: "safe"
            parameters:
              mode: "pin_model"

          - id: ai_save_prompt
            title: "Save prompt"
            title_ru: "Сохранить prompt"
            description: "Save the prompt editor text to package prompt cache."
            description_ru: "Сохранить текст редактора в кэш package prompt."
            service: "system_core.services.winget_ai_service:run_ai_package_control"
            kind: "safe"
            parameters:
              mode: "save_prompt"

      - id: ai_winget_actions
        title: "WinGet actions"
        title_ru: "WinGet-действия"
        description: "Search, add and execute exact IDs after review."
        description_ru: "Поиск, добавление и запуск точных ID после проверки."
        children:
          - id: ai_search_winget
            title: "Search WinGet"
            title_ru: "Поиск WinGet"
            description: "Search WinGet by text or exact ID and write a report."
            description_ru: "Найти пакеты WinGet по тексту или точному ID и записать отчёт."
            service: "system_core.services.winget_ai_service:search_winget_request"
            kind: "safe"
            fields:
              - id: search_query
                section: "request"
                type: "text"
                label: "Search query"
                label_ru: "Что искать"
                tooltip: "Search WinGet by app name, vendor, task, or exact package ID."
                tooltip_ru: "Искать в WinGet по названию, издателю, задаче или точному package ID."
                default: ""
                placeholder: "OBS Studio"
                span: "full"
              - id: exact_id_search
                section: "options"
                type: "checkbox"
                label: "Exact ID search"
                label_ru: "Искать точный ID"
                tooltip: "Treat the query as an exact WinGet ID and prefer exact matches."
                tooltip_ru: "Считать запрос точным WinGet ID и предпочитать точные совпадения."
                default: false
              - id: search_limit
                section: "options"
                type: "number"
                label: "Result limit"
                label_ru: "Лимит результатов"
                tooltip: "Maximum number of WinGet search results written to the report."
                tooltip_ru: "Максимальное число результатов WinGet search, которые попадут в отчёт."
                default: 20
                min: 1
                max: 100
                step: 1

          - id: ai_run_selected_plan_packages
            title: "Run selected from last AI plan"
            title_ru: "Запустить выбранное из AI-плана"
            description: "Install, update, pin or check exact validated IDs from the last AI plan cache."
            description_ru: "Установить, обновить, закрепить или проверить точные ID из последнего AI-плана."
            service: "system_core.services.winget_ai_service:run_selected_ai_plan_packages"
            kind: "dangerous"
            fields:
              - id: package_action
                section: "plan"
                type: "select"
                label: "Action"
                label_ru: "Действие"
                tooltip: "Choose what to do with the exact IDs selected from the last AI plan."
                tooltip_ru: "Выберите, что сделать с точными ID, отмеченными в последнем AI-плане."
                default: "install"
                options:
                  - value: "install"
                    label: "Install missing"
                    label_ru: "Установить отсутствующие"
                  - value: "update"
                    label: "Update installed"
                    label_ru: "Обновить установленные"
                  - value: "pin"
                    label: "Pin installed"
                    label_ru: "Закрепить установленные"
                  - value: "check"
                    label: "Check installed"
                    label_ru: "Проверить наличие"
                  - value: "uninstall"
                    label: "Uninstall selected"
                    label_ru: "Удалить выбранные"
              - id: packages_ai_plan
                section: "plan"
                type: "checkboxes"
                label: "Last AI plan exact IDs"
                label_ru: "Точные ID последнего AI-плана"
                tooltip: "Select only reviewed exact IDs from the last generated plan. Dangerous actions still use Audion confirmation flow."
                tooltip_ru: "Отмечайте только проверенные точные ID из последнего плана. Опасные действия всё равно идут через подтверждение Audion."
                default: []
                min_selected: 1
                options_source: "system_core.services.winget_ai_service:ai_plan_package_options"
                cache_seconds: 5
                grid_min_px: 300

          - id: ai_add_exact_package_to_list
            title: "Add exact ID to list"
            title_ru: "Добавить точный ID в список"
            description: "Add a reviewed exact WinGet ID to a config list and GUI group."
            description_ru: "Добавить проверенный точный WinGet ID в config-список и группу GUI."
            service: "system_core.services.winget_ai_service:add_exact_package_to_list"
            kind: "safe"
            fields:
              - id: package_id
                section: "package"
                type: "text"
                label: "Package ID"
                label_ru: "WinGet ID"
                tooltip: "Exact WinGet package ID to add, install, update or remove. Example: Microsoft.PowerShell."
                tooltip_ru: "Точный WinGet package ID для добавления, установки, обновления или удаления. Например: Microsoft.PowerShell."
                default: ""
                placeholder: "Microsoft.PowerShell"
              - id: package_label
                section: "package"
                type: "text"
                label: "Checkbox label"
                label_ru: "Название в чекбоксе"
                tooltip: "Optional friendly label for the GUI checkbox. If empty, the exact ID is used."
                tooltip_ru: "Необязательное понятное имя для чекбокса GUI. Если пусто, будет использован точный ID."
                default: ""
                placeholder: "PowerShell 7"
              - id: target_list
                section: "package"
                type: "select"
                label: "Target list"
                label_ru: "Список"
                tooltip: "Choose which Audion config list and GUI group should receive the reviewed package ID."
                tooltip_ru: "Выберите, в какой config-список и GUI-группу Audion добавить проверенный package ID."
                default: "custom"
                options:
                  - value: "system"
                    label: "System"
                    label_ru: "Система"
                  - value: "dev"
                    label: "Developer tools"
                    label_ru: "Разработка"
                  - value: "ai"
                    label: "AI"
                    label_ru: "AI"
                  - value: "pkms"
                    label: "PKMS and notes"
                    label_ru: "PKMS и заметки"
                  - value: "office"
                    label: "Office and documents"
                    label_ru: "Office и документы"
                  - value: "media_images"
                    label: "Media: images"
                    label_ru: "Медиа: изображения"
                  - value: "media_audio"
                    label: "Media: audio"
                    label_ru: "Медиа: звук"
                  - value: "media_video"
                    label: "Media: video"
                    label_ru: "Медиа: видео"
                  - value: "network"
                    label: "Browsers, VPN, messaging"
                    label_ru: "Браузеры, VPN, связь"
                  - value: "hardware"
                    label: "Hardware and service tools"
                    label_ru: "Железо и утилиты"
                  - value: "custom"
                    label: "Custom list only"
                    label_ru: "Custom, только список"
                  - value: "pins"
                    label: "Pins list only"
                    label_ru: "Пины, только список"

          - id: ai_install_exact_package
            title: "Install exact ID"
            title_ru: "Установить точный ID"
            description: "Install one reviewed exact WinGet ID through the existing Audion install path."
            description_ru: "Установить один проверенный точный WinGet ID через существующий путь Audion."
            service: "system_core.services.winget_ai_service:install_exact_package"
            kind: "dangerous"
            fields:
              - id: package_id
                section: "package"
                type: "text"
                label: "Package ID"
                label_ru: "WinGet ID"
                tooltip: "Exact WinGet ID to install through Audion's existing protected install path."
                tooltip_ru: "Точный WinGet ID для установки через существующий защищённый путь Audion."
                default: ""
                placeholder: "Microsoft.PowerShell"

          - id: ai_update_exact_package
            title: "Update exact ID"
            title_ru: "Обновить точный ID"
            description: "Update one reviewed exact WinGet ID through the existing Audion update path."
            description_ru: "Обновить один проверенный точный WinGet ID через существующий путь Audion."
            service: "system_core.services.winget_ai_service:update_exact_package"
            kind: "dangerous"
            fields:
              - id: package_id
                section: "package"
                type: "text"
                label: "Package ID"
                label_ru: "WinGet ID"
                tooltip: "Exact installed WinGet ID to update through Audion's existing update path."
                tooltip_ru: "Точный установленный WinGet ID для обновления через существующий путь Audion."
                default: ""
                placeholder: "Microsoft.PowerShell"

          - id: ai_uninstall_exact_package
            title: "Uninstall exact ID"
            title_ru: "Удалить точный ID"
            description: "Uninstall one reviewed exact WinGet ID through the existing protected Audion uninstall path."
            description_ru: "Удалить один проверенный точный WinGet ID через существующий защищённый путь Audion."
            service: "system_core.services.winget_ai_service:uninstall_exact_package"
            kind: "dangerous"
            fields:
              - id: package_id
                section: "package"
                type: "text"
                label: "Package ID"
                label_ru: "WinGet ID"
                tooltip: "Exact installed WinGet ID to uninstall. Protected system/runtime IDs require the separate force checkbox in the protected flow."
                tooltip_ru: "Точный установленный WinGet ID для удаления. Защищённые системные/runtime ID требуют отдельного force-флажка в защищённом сценарии."
                default: ""
                placeholder: "Microsoft.PowerShell"

  - id: portable
    title: "Portable Browsers"
    title_ru: "Portable-браузеры"
    description: "Download portable browser archives into output and build or update Google Chrome Portable."
    description_ru: "Скачать portable-архивы браузеров в output и собрать или обновить Google Chrome Portable."
    tooltip: "Portable mode writes ready archives to the selected output folder and does not install browsers into Windows."
    tooltip_ru: "Portable-режим кладёт готовые архивы в выбранную папку output и не устанавливает браузеры в Windows."
    children:
      - id: portable_install_google_chrome_web
        title: "Google Chrome (web installer)"
        title_ru: "Google Chrome (веб-установщик)"
        description: "Download the Google Chrome web installer for this system language and architecture, then install it silently."
        description_ru: "Скачать веб-установщик Google Chrome под язык и разрядность системы и установить его без вопросов."
        tooltip: "The ~12 MB web installer picks the locale and the x64/ARM64 build itself at install time, so it always matches the current system. This is a normal Windows install, not a portable build."
        tooltip_ru: "Веб-установщик (~12 МБ) сам подбирает локаль и сборку x64/ARM64 в момент установки, поэтому всегда соответствует текущей системе. Это обычная установка в Windows, а не portable-сборка."
        service: "system_core.services.portable_browser_service:install_google_chrome_web"
        kind: "dangerous"

      - id: portable_download_google_chrome_web
        title: "Google Chrome (download only)"
        title_ru: "Google Chrome (только скачать)"
        description: "Download the Google Chrome web installer into the portable archives folder without installing it."
        description_ru: "Скачать веб-установщик Google Chrome в папку portable-архивов, ничего не устанавливая."
        tooltip: "Same ~12 MB web installer, saved to output\\Portable\\_archives\\ChromeSetup.exe and left there."
        tooltip_ru: "Тот же веб-установщик (~12 МБ), сохраняется в output\\Portable\\_archives\\ChromeSetup.exe и остаётся там."
        service: "system_core.services.portable_browser_service:download_google_chrome_web"
        kind: "safe"

      - id: portable_install_7zip
        title: "Check / install portable 7-Zip"
        title_ru: "Проверить / установить portable 7-Zip"
        description: "Check Tools\\7zip\\bin\\7za.exe and run install\\Install-Portable-7Zip.cmd when it is missing."
        description_ru: "Проверить Tools\\7zip\\bin\\7za.exe и запустить install\\Install-Portable-7Zip.cmd, если 7-Zip отсутствует."
        service: "system_core.services.portable_browser_service:install_portable_7zip"
        kind: "dangerous"

      - id: portable_download_browsers
        title: "Download portable browsers"
        title_ru: "Скачать portable-браузеры"
        description: "Download selected portable browser packages and place ready ZIP/SFX artifacts into output\\Portable."
        description_ru: "Скачать выбранные portable-браузеры и положить готовые ZIP/SFX-артефакты в output\\Portable."
        service: "system_core.services.portable_browser_service:download_portable_browsers"
        kind: "safe"
        fields:
          - id: portable_browsers
            type: "checkboxes"
            label: "Portable browsers"
            label_ru: "Portable-браузеры"
            tooltip: "Choose which portable browser packages to download. Cent Browser is kept as its official portable SFX."
            tooltip_ru: "Выберите portable-браузеры для скачивания. Cent Browser сохраняется как официальный portable SFX."
            default:
              - "ungoogled_chromium_portable"
              - "zen_browser_portable"
              - "cent_browser_portable"
            min_selected: 1
            grid_min_px: 300
            options:
              - value: "ungoogled_chromium_portable"
                label: "Ungoogled Chromium Portable"
                label_ru: "Ungoogled Chromium Portable"
              - value: "zen_browser_portable"
                label: "Zen Browser Portable"
                label_ru: "Zen Browser Portable"
              - value: "cent_browser_portable"
                label: "Cent Browser Portable x64"
                label_ru: "Cent Browser Portable x64"
          - id: keep_temp
            type: "checkbox"
            label: "Keep temp"
            label_ru: "Сохранить temp"
            tooltip: "Leave output\\Portable\\_tmp after the operation for inspection or manual packaging checks."
            tooltip_ru: "Оставить output\\Portable\\_tmp после операции для проверки распаковки или ручного контроля упаковки."
            default: false
            span: "half"

      - id: portable_build_google_chrome
        title: "Build Google Chrome Portable"
        title_ru: "Собрать Google Chrome Portable"
        description: "Download Chrome++ and Google Chrome standalone, place Chrome-bin contents into App, and publish output\\Portable\\Google Chrome Portable. Archive only when enabled."
        description_ru: "Скачать Chrome++ и Google Chrome standalone, положить содержимое Chrome-bin в App и опубликовать output\\Portable\\Google Chrome Portable. Архивировать только если включено."
        service: "system_core.services.portable_browser_service:build_google_chrome_portable"
        kind: "safe"
        parameters:
          chrome_download_url: "https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe"
        fields:
          - id: chrome_source_preset
            type: "profile_buttons"
            label: "Chrome source"
            label_ru: "Источник Chrome"
            tooltip: "Quickly restore the official Google Chrome standalone x64 installer URL."
            tooltip_ru: "Быстро вернуть официальную ссылку Google Chrome standalone x64."
            presets:
              - id: "chrome_standalone_x64"
                label: "Standalone x64"
                label_ru: "Standalone x64"
                tooltip: "Official Google stable standalone installer. Usually this URL does not need to be changed."
                tooltip_ru: "Официальный стабильный standalone-установщик Google. Обычно эту ссылку менять не нужно."
                values:
                  chrome_download_url: "https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe"
          - id: chrome_download_url
            type: "text"
            label: "Chrome download URL"
            label_ru: "Ссылка Chrome"
            tooltip: "Direct URL to the Google Chrome standalone installer that contains Chrome.7z. Change only when Google moves the payload or you want a custom source."
            tooltip_ru: "Прямая ссылка на standalone-установщик Google Chrome, внутри которого ожидается Chrome.7z. Меняйте только если Google перенёс payload или нужен свой источник."
            default: "https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe"
            span: "full"
          - id: chrome_plus_arch
            type: "select"
            label: "Chrome++ arch"
            label_ru: "Архитектура Chrome++"
            tooltip: "Which Chrome++ wrapper folder to use from the Chrome++ archive. The Chrome runtime URL must match the selected architecture."
            tooltip_ru: "Какую папку оболочки Chrome++ взять из архива Chrome++. URL рантайма Chrome должен соответствовать выбранной архитектуре."
            default: "x64"
            span: "half"
            options:
              - value: "x64"
                label: "x64"
                label_ru: "x64"
              - value: "x86"
                label: "x86"
                label_ru: "x86"
              - value: "arm64"
                label: "ARM64"
                label_ru: "ARM64"
          - id: package_archive
            type: "checkbox"
            label: "Pack archive"
            label_ru: "Упаковать в архив"
            tooltip: "When disabled, publish a ready-to-use Google Chrome Portable folder. When enabled, also package it as ZIP or 7Z."
            tooltip_ru: "Если выключено, публикуется готовая папка Google Chrome Portable. Если включено, результат упаковывается в ZIP или 7Z."
            default: false
            span: "half"
          - id: archive_format
            type: "select"
            label: "Archive format"
            label_ru: "Формат архива"
            tooltip: "Archive format used only when Pack archive is enabled."
            tooltip_ru: "Формат используется только если включено «Упаковать в архив»."
            default: "zip"
            span: "half"
            options:
              - value: "zip"
                label: "ZIP"
                label_ru: "ZIP"
              - value: "7z"
                label: "7Z"
                label_ru: "7Z"
          - id: keep_temp
            type: "checkbox"
            label: "Keep temp"
            label_ru: "Сохранить temp"
            tooltip: "Leave output\\Portable\\_tmp after the operation for inspection or manual packaging checks."
            tooltip_ru: "Оставить output\\Portable\\_tmp после операции для проверки распаковки или ручного контроля упаковки."
            default: false
            span: "half"

      - id: portable_update_google_chrome
        title: "Update Google Chrome Portable"
        title_ru: "Обновить Google Chrome Portable"
        description: "Copy Google Chrome Portable from the selected input folder, clear only App, preserve Data and Cache, then publish the updated folder. Archive only when enabled."
        description_ru: "Скопировать Google Chrome Portable из выбранного input, очистить только App, сохранить Data и Cache, затем опубликовать обновлённую папку. Архивировать только если включено."
        service: "system_core.services.portable_browser_service:update_google_chrome_portable"
        kind: "safe"
        parameters:
          chrome_download_url: "https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe"
        fields:
          - id: chrome_source_preset
            type: "profile_buttons"
            label: "Chrome source"
            label_ru: "Источник Chrome"
            tooltip: "Quickly restore the official Google Chrome standalone x64 installer URL."
            tooltip_ru: "Быстро вернуть официальную ссылку Google Chrome standalone x64."
            presets:
              - id: "chrome_standalone_x64"
                label: "Standalone x64"
                label_ru: "Standalone x64"
                tooltip: "Official Google stable standalone installer. Usually this URL does not need to be changed."
                tooltip_ru: "Официальный стабильный standalone-установщик Google. Обычно эту ссылку менять не нужно."
                values:
                  chrome_download_url: "https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe"
          - id: chrome_download_url
            type: "text"
            label: "Chrome download URL"
            label_ru: "Ссылка Chrome"
            tooltip: "Direct URL to the Google Chrome standalone installer that contains Chrome.7z. Change only when Google moves the payload or you want a custom source."
            tooltip_ru: "Прямая ссылка на standalone-установщик Google Chrome, внутри которого ожидается Chrome.7z. Меняйте только если Google перенёс payload или нужен свой источник."
            default: "https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe"
            span: "full"
          - id: chrome_plus_arch
