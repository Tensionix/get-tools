        label_ru: "MSVC 2005 x86"

x-pin-fields: &pin_fields
  - id: packages_pins
    type: "checkboxes"
    label: "pins.txt"
    label_ru: "pins.txt"
    hint: "IDs already listed in config\\pins.txt. Keep them at the top and run to apply missing blocking pins."
    hint_ru: "ID, уже записанные в config\\pins.txt. Они всегда сверху; запуск применит недостающие blocking-пины."
    default: []
    options_source: "system_core.services.winget_service:pins_config_options"
    cache_seconds: 20
    grid_min_px: 260
  - id: packages_installed_pins
    type: "checkboxes"
    label: "Installed packages"
    label_ru: "Установленные пакеты"
    hint: "Select installed IDs to append them to config\\pins.txt and apply blocking pins in one run."
