          - "uup_platform"
          - "uup_product"
          - "uup_lang"
          - "uup_lang_other"
          - "uup_edition"
          - "uup_virtual"
      - id: vendor_extract
        section: "options"
        type: "checkbox"
        hidden_when:
          vendor: "uupdump"
        label: "Unpack zip"
        label_ru: "Распаковать zip"
        tooltip: "Unpack the archive into its folder, so the installer is at hand. When everything in the zip sits in one root folder, that folder is dropped and the files land at the top. Only zip; exe, msix, dmg and tar stay as they are."
        tooltip_ru: "Распаковать архив в его папку, чтобы установщик был под рукой. Если всё в zip лежит в одной корневой папке, она отбрасывается и файлы ложатся наверх. Только zip; exe, msix, dmg и tar остаются как есть."
        default: true
        span: "half"
      - id: vendor_delete_zip
        section: "options"
        type: "checkbox"
        hidden_when:
          vendor: "uupdump"
        label: "Delete zip after unpacking"
        label_ru: "Удалить zip после распаковки"
        tooltip: "Once unpacked, the archive only doubles the disk use. Off keeps both."
        tooltip_ru: "После распаковки архив только удваивает место на диске. Выключено оставляет оба."
        default: true
        span: "half"
      - id: uup_skip_edge
        hidden: true
        section: "options"
        type: "checkbox"
        label: "Without Edge"
        label_ru: "Без Edge"
        tooltip: "Tell the converter to leave the Edge browser out of the image (its SkipEdge option). The Edge WebView2 runtime is untouched and stays in the system: it is a separate component, apps run and are built on it, from the new Outlook and Teams to third-party programs."
        tooltip_ru: "Сказать конвертеру не класть браузер Edge в образ (его опция SkipEdge). Среда Edge WebView2 не затрагивается и остаётся в системе: это отдельный компонент, на нём работают и собираются приложения, от новых Outlook и Teams до сторонних программ."
        default: true
        span: "half"
        visible_when:
          vendor: "uupdump"
      - id: uup_run
        section: "options"
        type: "checkbox"
        label: "Build the ISO right away"
        label_ru: "Сразу собрать ISO"
        tooltip: "After the package is unpacked, start its uup_download_windows.cmd in a console: it downloads the files from Microsoft with aria2 and assembles the ISO. The build runs in the UUP folder at the root of the program's drive; the finished image is moved to the destination folder. Needs administrator rights; takes a while."
        tooltip_ru: "После распаковки пакета запустить его uup_download_windows.cmd в консоли: он скачивает файлы с серверов Microsoft через aria2 и собирает ISO. Сборка идёт в папке UUP в корне диска программы, готовый образ переносится в папку назначения. Нужны права администратора; занимает время."
        default: true
        span: "half"
        visible_when:
          vendor: "uupdump"
      - id: uup_clean_cache
        section: "options"
        type: "checkbox"
        label: "Delete cache after ISO"
        label_ru: "Удалить кэш после ISO"
        tooltip: "Once the image is moved to the destination, the build folder in the UUP folder at the root of the program's drive, with the converter's scripts and the 9 GB of Microsoft's files, is deleted. Off: the folder stays, so the same build can be reassembled with other apps without downloading again."
        tooltip_ru: "Когда образ перенесён в папку назначения, папка сборки в UUP в корне диска программы, со скриптами конвертера и 9 ГБ файлов Microsoft, удаляется. Выключено: папка остаётся, и ту же сборку можно пересобрать с другими приложениями без повторного скачивания."
        default: false
        span: "half"
        visible_when:
          vendor: "uupdump"
          uup_run: true
      - id: uup_add_drivers
        section: "options"
        type: "checkbox"
        label: "Embed drivers from input into the image"
        label_ru: "Вшить драйверы из input в образ"
        tooltip: "Step by step. 1) Get driver packages: open 'This machine's drivers' in the operations list, the network drivers are ticked already, tick more if you want, press Export: the packages go into output\\Drivers as folders with .inf, .sys and .cat; or copy such folders from anywhere. 2) Put them anywhere inside the input folder (the Source path at the top of the window): the exported Drivers folder as is, a folder named after the laptop, or the packages at the top, the program finds every .inf itself. 3) Tick this box and build the ISO: each package is copied into the build's Drivers\\OS and DISM embeds them into install.wim, so Windows Setup installs them with the system. Only unpacked INF packages work, a vendor's .exe installer does not; the architecture must match the image (x64); unsigned drivers need test signing on the target. Storage or RAID drivers that Setup itself needs to see the disk are not covered here."
        tooltip_ru: "По шагам. 1) Получите пакеты драйверов: откройте «Драйверы этой машины» в списке операций, сетевые уже отмечены, отметьте ещё что хотите, нажмите «Экспорт»: пакеты лягут в output\\Drivers папками с .inf, .sys и .cat; или скопируйте такие папки откуда угодно. 2) Положите их куда угодно внутрь входной папки (путь «Источник» вверху окна): папку Drivers из экспорта как есть, папку с именем ноутбука или пакеты прямо сверху, программа сама найдёт каждый .inf. 3) Поставьте эту галочку и соберите ISO: каждый пакет копируется в Drivers\\OS сборки, DISM вшивает их в install.wim, и установщик Windows ставит их вместе с системой. Работают только распакованные INF-пакеты, exe-установщик вендора не годится; разрядность должна совпадать с образом (x64); неподписанные драйверы потребуют тестового режима на целевой машине. Драйверы дисков и RAID, без которых сам установщик не видит диск, сюда не входят."
        default: false
        span: "half"
        visible_when:
          vendor: "uupdump"
      - id: vendor_flat
        section: "options"
        type: "checkbox"
        label: "Straight into the destination folder"
        label_ru: "Сразу в папку назначения"
        tooltip: "Skip the Vendors\\<Vendor> levels: each build folder lands directly in the destination. For a store that already is the vendor's folder."
        tooltip_ru: "Без уровней Vendors\\<Производитель>: папка каждой сборки ложится прямо в папку назначения. Для склада, который сам и есть папка производителя."
        default: false
        span: "half"
      - id: bmd_reg_firstname
        section: "registration"
        type: "text"
        label: "First name"
        label_ru: "Имя"
        tooltip: "Only for the free DaVinci Resolve: Blackmagic issues its link after this form. Sent straight to blackmagicdesign.com, nothing is kept here."
        tooltip_ru: "Только для бесплатной DaVinci Resolve: Blackmagic выдаёт ссылку после этой анкеты. Уходит напрямую на blackmagicdesign.com, здесь ничего не хранится."
        default: ""
        span: "half"
        visible_when:
          vendor: "blackmagic"
          bmd_product: ["DaVinci Resolve", "*"]
      - id: bmd_reg_lastname
        section: "registration"
        type: "text"
        label: "Last name"
        label_ru: "Фамилия"
        tooltip: "Part of the Blackmagic form for the free Resolve."
        tooltip_ru: "Часть анкеты Blackmagic для бесплатной Resolve."
        default: ""
        span: "half"
        visible_when:
          vendor: "blackmagic"
          bmd_product: ["DaVinci Resolve", "*"]
      - id: bmd_reg_email
        section: "registration"
        type: "text"
        label: "E-mail"
        label_ru: "E-mail"
        tooltip: "Part of the Blackmagic form for the free Resolve. No confirmation letter is sent."
        tooltip_ru: "Часть анкеты Blackmagic для бесплатной Resolve. Письмо с подтверждением не приходит."
        default: ""
        span: "half"
        visible_when:
          vendor: "blackmagic"
          bmd_product: ["DaVinci Resolve", "*"]
      - id: bmd_reg_phone
        section: "registration"
        type: "text"
        label: "Phone"
        label_ru: "Телефон"
        tooltip: "Part of the Blackmagic form for the free Resolve."
        tooltip_ru: "Часть анкеты Blackmagic для бесплатной Resolve."
        default: ""
        span: "half"
        visible_when:
          vendor: "blackmagic"
          bmd_product: ["DaVinci Resolve", "*"]
      - id: bmd_reg_country
        section: "registration"
        type: "text"
        label: "Country code"
        label_ru: "Код страны"
        tooltip: "Two-letter code as the Blackmagic site uses it, for example us or de."
        tooltip_ru: "Двухбуквенный код, как на сайте Blackmagic, например us или de."
        default: ""
        span: "half"
        visible_when:
          vendor: "blackmagic"
          bmd_product: ["DaVinci Resolve", "*"]
      - id: bmd_reg_city
        section: "registration"
        type: "text"
        label: "City"
        label_ru: "Город"
        tooltip: "Part of the Blackmagic form for the free Resolve."
        tooltip_ru: "Часть анкеты Blackmagic для бесплатной Resolve."
        default: ""
        span: "half"
        visible_when:
          vendor: "blackmagic"
          bmd_product: ["DaVinci Resolve", "*"]
      - id: bmd_reg_street
        section: "registration"
        type: "text"
        label: "Street"
        label_ru: "Улица"
        tooltip: "Part of the Blackmagic form for the free Resolve."
        tooltip_ru: "Часть анкеты Blackmagic для бесплатной Resolve."
        default: ""
        span: "half"
        visible_when:
          vendor: "blackmagic"
          bmd_product: ["DaVinci Resolve", "*"]
      - id: bmd_reg_state
        section: "registration"
        type: "text"
        label: "State / region"
        label_ru: "Регион"
        tooltip: "Part of the Blackmagic form for the free Resolve."
        tooltip_ru: "Часть анкеты Blackmagic для бесплатной Resolve."
        default: ""
        span: "half"
        visible_when:
          vendor: "blackmagic"
          bmd_product: ["DaVinci Resolve", "*"]
    children:
      - id: vendor_download
        title: "Download"
        title_ru: "Скачать"
        description: "Fetch the ticked versions into a folder per build, resuming an interrupted file, and unpack the zip when asked."
        description_ru: "Скачать отмеченные версии, каждую в свою папку, с докачкой прерванного файла, и распаковать zip, если включено."
        service: "system_core.services.vendor_service:download_vendor_builds"
        kind: "safe"
        parameters:
          primary: true
          gate: "system_core.services.vendor_service:download_gate"
      - id: vendor_link
        title: "Link only"
        title_ru: "Только ссылка"
        description: "Resolve the download links for the ticked versions and print them to the log and to report\\links.txt; nothing is downloaded."
        description_ru: "Получить ссылки на отмеченные версии и вывести их в журнал и в report\\links.txt, ничего не скачивая."
        service: "system_core.services.vendor_service:link_vendor_builds"
        kind: "safe"
      - id: vendor_uup_adk
        title: "Install ADK"
        title_ru: "Установить ADK"
        description: "Why: the UUP dump converter puts the cumulative update, the extra editions and the drivers into the image with DISM, and it takes that DISM from the Windows ADK Deployment Tools; the system DISM of a newer host refuses, and the image comes out without updates. This button fetches Microsoft's adksetup.exe and installs only the Deployment Tools, about 100 MB, once per machine. Asks for administrator rights. Until it is installed, the Windows download stays closed."
        description_ru: "Зачем: конвертер UUP dump вшивает накопительное обновление, дополнительные редакции и драйверы в образ через DISM, и берёт этот DISM из Windows ADK Deployment Tools; системный DISM более новой машины отказывает, и образ выходит без обновлений. Кнопка скачивает adksetup.exe от Microsoft и ставит только Deployment Tools, около 100 МБ, один раз на машину. Спросит права администратора. Пока не установлено, скачивание Windows закрыто."
        service: "system_core.services.vendor_service:install_adk_deployment_tools"
        kind: "dangerous"
        parameters:
          validate_fields: false
          visible_when:
            vendor: "uupdump"

      - id: vendor_winutil
        title: "WinUtil"
        title_ru: "WinUtil"
        description: "Open Chris Titus's Windows utility (irm https://christitus.com/win | iex) in its own terminal: tweaks, debloat, program installs, Windows updates control. Runs in Windows Terminal when it is installed, otherwise in a plain console, with PowerShell 7 when present and Windows PowerShell 5.1 as the fallback. The script is downloaded from the author's site at launch and asks for administrator rights in its own window."
        description_ru: "Открыть утилиту Криса Титуса для Windows (irm https://christitus.com/win | iex) в отдельном терминале: твики, чистка, установка программ, управление обновлениями. Запускается в Windows Terminal, если он установлен, иначе в обычной консоли; PowerShell 7, если есть, иначе Windows PowerShell 5.1. Скрипт скачивается с сайта автора при запуске и сам просит права администратора в своём окне."
        service: "system_core.services.external_tools_service:launch_winutil"
        kind: "dangerous"
        parameters:
          validate_fields: false
          visible_when:
            vendor: "uupdump"

      - id: export_selected_drivers
        title: "Export drivers"
        title_ru: "Экспорт драйверов"
        description: "Step by step. 1) In the section This machine's drivers below, the network drivers are ticked already; tick anything else you want. 2) Press this button: pnputil /export-driver copies every ticked driver into output\\Drivers, one folder per package with .inf, .sys and .cat; nothing on the machine changes. 3) Move that Drivers folder into the input folder (the Source path at the top of the window), under any name. 4) Tick 'Embed drivers from input into the image' in the Options row at the top of this tab together with 'Build the ISO right away': while building, the program finds every .inf anywhere under input and DISM embeds the packages into install.wim, so Windows Setup installs them with the system. Without that checkbox the drivers stay in input and are not embedded."
        description_ru: "По шагам. 1) В секции «Драйверы этой машины» ниже сетевые драйверы уже отмечены; отметьте, что ещё хотите. 2) Нажмите эту кнопку: pnputil /export-driver скопирует каждый отмеченный драйвер в output\\Drivers, по папке на пакет с .inf, .sys и .cat; на машине ничего не меняется. 3) Перенесите папку Drivers во входную папку (путь «Источник» вверху окна), под любым именем. 4) Поставьте галочку «Вшить драйверы из input в образ» в ряду «Опции» вверху этой вкладки вместе с «Сразу собрать ISO»: при сборке программа найдёт все .inf где угодно внутри input, и DISM вошьёт пакеты в install.wim, так что установщик Windows поставит их вместе с системой. Без этой галочки драйверы остаются в input и не вшиваются."
        service: "system_core.services.vendor_service:export_selected_drivers"
        kind: "safe"
        parameters:
          validate_fields: false
          visible_when:
            vendor: "uupdump"

  - id: import_export
    title: "Import / export"
    title_ru: "Импорт / экспорт"
    description: "WinGet JSON import and export with GUI fields."
    description_ru: "WinGet JSON импорт и экспорт через поля GUI."
    children:
      - id: export_winget
        title: "Export JSON"
        title_ru: "Экспорт JSON"
        description: "Export installed WinGet packages to output."
        description_ru: "Экспортировать установленные WinGet-пакеты в output."
        service: "system_core.services.winget_service:export_winget"
        kind: "safe"
        fields:
          - id: export_path
            type: "text"
            label: "Export path"
            label_ru: "Файл экспорта"
            default: "output\\winget-export.json"
          - id: include_versions
            type: "checkbox"
            label: "Include versions"
            label_ru: "Включить версии"
            default: true

      - id: import_winget
        title: "Import JSON"
        title_ru: "Импорт JSON"
        description: "Import packages from a WinGet export file."
        description_ru: "Импортировать пакеты из файла WinGet export."
        service: "system_core.services.winget_service:import_winget"
        kind: "dangerous"
        fields:
          - id: import_path
            type: "text"
            label: "Import path"
            label_ru: "Файл импорта"
            default: "input\\winget-export.json"
          - id: ignore_versions
            type: "checkbox"
            label: "Ignore versions"
            label_ru: "Игнорировать версии"
            default: false
          - id: no_upgrade
            type: "checkbox"
            label: "Do not upgrade installed packages"
            label_ru: "Не обновлять уже установленные"
            default: false
          - id: ignore_unavailable
            type: "checkbox"
            label: "Ignore unavailable packages"
            label_ru: "Игнорировать недоступные"
            default: true

  - id: classic_scripts
    title: "Classic scripts"
    title_ru: "Классические скрипты"
    description: "Compatibility commands that run existing project CMD scripts."
    description_ru: "Совместимые команды, запускающие существующие CMD-скрипты проекта."
    children:
      - id: update_winget_self
        title: "Update WinGet (script)"
        title_ru: "Обновить WinGet (скрипт)"
        description: "Run the existing Microsoft App Installer update script."
        description_ru: "Запустить существующий скрипт обновления Microsoft App Installer."
        service: "system_core.services.winget_service:update_winget_self"
        kind: "dangerous"

      - id: download_msvc_all_in_one
        title: "MSVC All-in-One (TechPowerUp)"
        title_ru: "MSVC All-in-One (TechPowerUp)"
        description: "Download the Visual C++ Runtimes All-in-One package and unpack it; nothing is installed."
        description_ru: "Скачать пакет Visual C++ Runtimes All-in-One и распаковать его; ничего не устанавливается."
        tooltip: "One archive with every VC++ runtime from 2005 to 2015+, x86 and x64, plus its own install_all.bat. Resolved through the TechPowerUp mirror flow at click time because the file URL is signed and expires."
        tooltip_ru: "Один архив со всеми рантаймами VC++ от 2005 до 2015+, x86 и x64, вместе с собственным install_all.bat. Ссылка подписана и живёт недолго, поэтому она добывается через зеркала TechPowerUp в момент нажатия."
        service: "system_core.services.vcredist_service:download_msvc_all_in_one"
        kind: "safe"
        parameters:
          page_url: "https://www.techpowerup.com/download/visual-c-redistributable-runtime-package-all-in-one/"

      - id: download_msvc_aio_abbodi
        title: "MSVC AIO (abbodi1406)"
        title_ru: "MSVC AIO (abbodi1406)"
        description: "Download the latest VisualCppRedist_AIO x86+x64 release; nothing is installed."
        description_ru: "Скачать свежий выпуск VisualCppRedist_AIO x86+x64; ничего не устанавливается."
        tooltip: "One self-contained executable that installs every VC++ runtime from 2005 to v14, including 2012, which WinGet does not carry. Silent switch is /ai and it needs elevation, so Audion Get Tools only downloads it."
        tooltip_ru: "Один самодостаточный исполняемый файл, ставящий все рантаймы VC++ от 2005 до v14, включая 2012, которого в WinGet нет вовсе. Тихий ключ — /ai, нужны права администратора, поэтому Audion Get Tools только скачивает его."
        service: "system_core.services.vcredist_service:download_msvc_aio_abbodi"
        kind: "safe"
        parameters:
          aio_variant: "x86_x64"
          page_url: "https://github.com/abbodi1406/vcredist/releases/latest"

      - id: install_msvc_all_in_one
        title: "Install MSVC All-in-One (TechPowerUp)"
        title_ru: "Установить MSVC All-in-One (TechPowerUp)"
        description: "Download the TechPowerUp bundle and run install_all.bat: every VC++ runtime from 2005 to v14, x86 and x64."
        description_ru: "Скачать набор TechPowerUp и запустить install_all.bat: все рантаймы VC++ от 2005 до v14, x86 и x64."
        tooltip: "A third-party script installs ten vendor packages one after another with /passive /norestart. Administrator rights are required; progress windows are normal. The registry state before and after is written to the log."
        tooltip_ru: "Сторонний скрипт ставит подряд десять пакетов от производителя с ключами /passive /norestart. Нужны права администратора, окна прогресса — это нормально. Состояние реестра до и после пишется в лог."
        service: "system_core.services.vcredist_service:install_msvc_all_in_one"
        kind: "dangerous"

      - id: install_msvc_aio_abbodi
        title: "Install MSVC AIO (abbodi1406)"
        title_ru: "Установить MSVC AIO (abbodi1406)"
        description: "Download VisualCppRedist_AIO and run it silently with /ai: every VC++ runtime including 2012."
        description_ru: "Скачать VisualCppRedist_AIO и запустить тихо с ключом /ai: все рантаймы VC++, включая 2012."
        tooltip: "One third-party executable installs the whole family without questions. Administrator rights are required. The registry state before and after is written to the log, because the installer's own exit code says little."
        tooltip_ru: "Один сторонний исполняемый файл ставит всё семейство без вопросов. Нужны права администратора. Состояние реестра до и после пишется в лог, потому что собственный код возврата установщика мало о чём говорит."
        service: "system_core.services.vcredist_service:install_msvc_aio_abbodi"
        kind: "dangerous"
        parameters:
          aio_variant: "x86_x64"

      - id: install_msvc_2015_script
        title: "Install MSVC 2015+"
        title_ru: "MSVC 2015+"
        description: "Run Install-Audion-MSVC-2015+.cmd."
        description_ru: "Запустить Install-Audion-MSVC-2015+.cmd."
        service: "system_core.services.winget_service:run_cmd_operation"
        kind: "dangerous"
        parameters:
          script: "system_core\\winget\\install_apps\\Install-Audion-MSVC-2015+.cmd"

      - id: install_msvc_legacy_script
        title: "Install MSVC Legacy"
        title_ru: "MSVC Legacy"
        description: "Run Install-Audion-MSVC.cmd."
        description_ru: "Запустить Install-Audion-MSVC.cmd."
        service: "system_core.services.winget_service:run_cmd_operation"
        kind: "dangerous"
        parameters:
          script: "system_core\\winget\\install_apps\\Install-Audion-MSVC.cmd"

      - id: update_msvc_2015_script
        title: "Update MSVC 2015+"
        title_ru: "Обновить MSVC 2015+"
        description: "Run Update-Audion-MSVC-2015+.cmd."
        description_ru: "Запустить Update-Audion-MSVC-2015+.cmd."
        service: "system_core.services.winget_service:run_cmd_operation"
        kind: "dangerous"
        parameters:
          script: "system_core\\winget\\install_apps\\Update-Audion-MSVC-2015+.cmd"

maintenance_operations:
  - id: check_windows_activation
    title: "Windows licence state"
