operations: []

operation_groups:
  - id: install_selected_packages
    title: "Install selected"
    title_ru: "Установить выбранные"
    description: "Scan the system, show only missing packages, and install checked IDs without Y/N/Q prompts."
    description_ru: "Просканировать систему, показать только отсутствующие пакеты и установить отмеченные ID без консольных Y/N/Q."
    service: "system_core.services.winget_service:run_selected_packages"
    kind: "dangerous"
    parameters:
      package_action: "install"
    fields: *package_fields

  - id: preview_available_updates
    title: "Preview updates"
    title_ru: "Предпросмотр обновлений"
    description: "Show the current WinGet update list as Name | ID | current -> available and write a report."
    description_ru: "Показать текущий список обновлений WinGet как Name | ID | current -> available и записать отчёт."
    service: "system_core.services.winget_service:preview_available_updates"
    kind: "safe"

  - id: update_all_available_packages
    title: "Update all available"
    title_ru: "Обновить всё доступное"
    description: "Run winget upgrade scan and update every package with an available update."
    description_ru: "Просканировать winget upgrade и обновить все пакеты, для которых есть обновление."
    service: "system_core.services.winget_service:update_all_available_packages"
    kind: "dangerous"

  - id: update_app_installer
    title: "Update WinGet"
    title_ru: "Обновить WinGet"
    description: "Update WinGet itself. Restart Audion Get Tools afterwards."
    description_ru: "Обновить сам WinGet. После обновления перезапустите Audion Get Tools."
    tooltip: "WinGet ships inside the Microsoft App Installer package and replaces itself while it runs, so it is updated alone, outside the package checkboxes. Restart Audion Get Tools after it finishes."
    tooltip_ru: "WinGet поставляется пакетом Microsoft App Installer и подменяет сам себя во время работы, поэтому обновляется отдельно, вне чекбоксов пакетов. После завершения перезапустите Audion Get Tools."
    service: "system_core.services.winget_service:update_app_installer"
    kind: "dangerous"

  - id: update_selected_packages
    title: "Update selected"
    title_ru: "Обновить выбранные"
    description: "Show available updates by project groups and update only checked IDs."
    description_ru: "Показать доступные обновления по группам проекта и обновить только отмеченные ID."
    service: "system_core.services.winget_service:run_selected_packages"
    kind: "dangerous"
    parameters:
      package_action: "update"
    fields: *package_fields

  - id: update_available_packages
    title: "Update available"
    title_ru: "Обновить доступные"
    description: "Load currently available updates from winget upgrade and update only checked items."
    description_ru: "Загрузить доступные обновления через winget upgrade и обновить только отмеченные."
    service: "system_core.services.winget_service:update_available_packages"
    kind: "dangerous"
    fields:
      - id: packages_available_updates
        type: "checkboxes"
        label: "Available updates"
        label_ru: "Доступные обновления"
        default: []
        options_source: "system_core.services.winget_service:available_update_options"
        cache_seconds: 20

  - id: pin_selected_packages
    title: "Pin selected"
    title_ru: "Закрепить выбранные"
    description: "Show pins.txt first, add checked installed IDs to it, and apply blocking WinGet pins."
    description_ru: "Показать pins.txt сверху, добавить отмеченные установленные ID в него и поставить blocking-пины."
    service: "system_core.services.winget_service:pin_selected_packages"
    kind: "dangerous"
    fields: *pin_fields

  - id: single_package
    title: "Install / uninstall by ID"
    title_ru: "Установка, удаление по ID"
    description: "Search, install typed IDs, and uninstall installed WinGet IDs."
    description_ru: "Поиск, установка введённых ID и удаление установленных WinGet ID."
    children:
      - id: search_winget
        title: "Search"
        title_ru: "Поиск"
        description: "Search the WinGet registry by text."
        description_ru: "Поиск в реестре WinGet по тексту."
        service: "system_core.services.winget_service:search_winget"
        kind: "safe"
        fields:
          - id: query
            type: "text"
            label: "Search query"
            label_ru: "Что искать"
            default: ""
            placeholder: "PowerShell"

      - id: add_package_to_list
        title: "Add ID to list"
        title_ru: "Добавить ID в список"
        description: "Add an exact WinGet ID from search results to a config list and the matching GUI checkbox group."
        description_ru: "Добавить точный WinGet ID из результатов поиска в config-список и соответствующую группу чекбоксов GUI."
        service: "system_core.services.winget_service:add_package_to_list"
        kind: "safe"
        fields:
          - id: package_id
            type: "text"
            label: "Package ID"
            label_ru: "WinGet ID"
            default: ""
            placeholder: "Microsoft.PowerShell"
          - id: package_label
            type: "text"
            label: "Checkbox label"
            label_ru: "Название в чекбоксе"
