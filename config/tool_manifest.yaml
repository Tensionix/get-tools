        tooltip_ru: "Одно нажатие выставляет базовую редакцию и дополнительные так, как это делают носители Microsoft. Business: Pro с Enterprise, Education, Pro Education и Pro for Workstations. Consumer: Home и Pro с Education, Pro Education и Pro for Workstations. Plain: одна Pro."
