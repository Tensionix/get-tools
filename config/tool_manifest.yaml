        tooltip_ru: "Чей каталог смотреть. Blackmagic: Resolve, Fusion, RAW, Desktop Video и весь каталог. Affinity: Photo, Designer, Publisher 2 и единая Affinity 3. NVIDIA: драйверы Game Ready и Studio по поколениям чипов, NVIDIA App, Broadcast, CUDA Toolkit и DLSS. TechPowerUp: драйверы AMD, Intel и Qualcomm плюс утилиты, мониторинг, бенчмарки и прошивальщики BIOS видеокарт с сайта, все версии. Windows (UUP dump): каждая сборка Windows 11 и 10 со своим накопительным обновлением, пакетом скриптов, который собирает ISO из файлов самой Microsoft."
