    type: "profile_buttons"
    label: "Selection profiles"
    label_ru: "Профили выбора"
    hint: "Presets only mark checkboxes; you can adjust every package before running."
    hint_ru: "Профили только отмечают чекбоксы; перед запуском можно поправить каждый пакет."
