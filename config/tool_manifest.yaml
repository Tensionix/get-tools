            options:
              - value: "system"
                label: "System"
                label_ru: "Система"
              - value: "dev"
                label: "Developer tools"
                label_ru: "Разработка"
              - value: "ai"
                label: "AI"
                label_ru: "AI"
              - value: "pkms"
                label: "PKMS and notes"
                label_ru: "PKMS и заметки"
              - value: "office"
                label: "Office and documents"
                label_ru: "Office и документы"
              - value: "media_images"
                label: "Media: images"
                label_ru: "Медиа: изображения"
              - value: "media_audio"
                label: "Media: audio"
                label_ru: "Медиа: звук"
              - value: "media_video"
                label: "Media: video"
                label_ru: "Медиа: видео"
              - value: "network"
                label: "Browsers, VPN, messaging"
                label_ru: "Браузеры, VPN, связь"
              - value: "hardware"
                label: "Hardware and service tools"
                label_ru: "Железо и утилиты"
              - value: "custom"
                label: "Custom list only"
                label_ru: "Custom, только список"
              - value: "pins"
                label: "Pins list only"
                label_ru: "Пины, только список"

      - id: install_package_by_id
        title: "Install by ID"
        title_ru: "Установить по ID"
        description: "Install any exact WinGet package ID typed into the field."
        description_ru: "Установить любой точный WinGet ID из поля ввода."
        service: "system_core.services.winget_service:install_package_by_id"
        kind: "dangerous"
        fields:
          - id: package_id
            type: "text"
            label: "Package ID"
            label_ru: "WinGet ID"
            default: ""
            placeholder: "Microsoft.PowerShell"

      - id: uninstall_package_by_id
        title: "Uninstall by ID"
        title_ru: "Удалить по ID"
        description: "Uninstall one exact WinGet package ID typed into the field. Protected system/runtime IDs require an extra checkbox."
        description_ru: "Удалить один точный WinGet ID из поля ввода. Защищённые системные/рантайм ID требуют отдельного флажка."
        service: "system_core.services.winget_service:uninstall_package_by_id"
        kind: "dangerous"
        fields:
          - id: package_id
            type: "text"
            label: "Package ID"
            label_ru: "WinGet ID"
            default: ""
            placeholder: "Mozilla.Firefox"
          - id: confirm_protected_uninstall_by_id
            type: "checkbox"
            label: "Allow protected system/runtime removal"
            label_ru: "Разрешить удаление защищённых системных/рантайм ID"
