tool:
  id: audion_get
  name: "Audion Get"
  category: "Windows package management"
  version: "7.0.0-gui"

paths:
  input: "input"
  output: "output"
  logs: "logs"
  workspace: "workspace"
  config: "config"
  release: "release"

ui:
  title: "Audion Get Tools"
  host: "127.0.0.1"
  port: 8088
  width: 1600
  height: 900
  min_width: 1280
  min_height: 720
  native: false
  reload: false
  open_browser: false

x-package-fields: &package_fields
