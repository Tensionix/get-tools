  - id: packages_msvc
    type: "checkboxes"
    label: "MSVC runtime (2015+)"
    label_ru: "MSVC рантайм (2015+)"
    hint: "For a modern system this is the only runtime that matters. For the whole 2005-2013 family use the TechPowerUp or abbodi1406 all-in-one bundle in Classic scripts: it also covers 2012, which WinGet does not have."
    hint_ru: "Для современной системы это единственный нужный рантайм. Всё семейство 2005-2013 удобнее ставить набором TechPowerUp или abbodi1406 в «Классических скриптах»: там есть и 2012, которого в WinGet нет вовсе."
    tooltip: "Official Microsoft packages for the 2015+ (v14) runtime, x86 and x64."
    tooltip_ru: "Официальные пакеты Microsoft для рантайма 2015+ (v14), x86 и x64."
