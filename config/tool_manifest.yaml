tool:
  id: audion_get
  name: "Audion Get"
  category: "Windows package management"
  version: "7.0.0-gui"

paths:
  input: "input"
  output: "output"
  logs: "logs"
  workspace: "workspace"
  config: "config"
  release: "release"

ui:
  title: "Audion Get Tools"
  host: "127.0.0.1"
  port: 8088
  width: 1600
  height: 900
  min_width: 1280
  min_height: 720
  native: false
  reload: false
  open_browser: false

x-package-fields: &package_fields
  - id: package_profile
    type: "profile_buttons"
    label: "Selection profiles"
    label_ru: "Профили выбора"
    hint: "Presets only mark checkboxes; you can adjust every package before running."
    hint_ru: "Профили только отмечают чекбоксы; перед запуском можно поправить каждый пакет."
    presets:
      - id: "clear"
        label: "Clear"
        label_ru: "Снять всё"
        values:
          packages_system: []
          packages_dev: []
          packages_ai: []
          packages_pkms: []
          packages_office: []
          packages_media_images: []
          packages_media_audio: []
          packages_media_video: []
          packages_network: []
          packages_hardware: []
          packages_msvc: []
          packages_msvc_legacy: []
