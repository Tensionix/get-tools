      - id: "clear"
        label: "Clear"
        label_ru: "Снять всё"
        values:
          packages_system: []
          packages_dev: []
          packages_ai: []
          packages_pkms: []
          packages_office: []
          packages_media_images: []
          packages_media_audio: []
          packages_media_video: []
          packages_network: []
          packages_hardware: []
          packages_msvc: []
          packages_msvc_legacy: []
