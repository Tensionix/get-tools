  - id: packages_msvc
    type: "checkboxes"
    label: "MSVC runtime (2015+)"
    label_ru: "MSVC рантайм (2015+)"
    hint: "For a modern system this is the only runtime that matters. For the whole 2005-2013 family use the TechPowerUp or abbodi1406 all-in-one bundle in Classic scripts: it also covers 2012, which WinGet does not have."
    hint_ru: "Для современной системы это единственный нужный рантайм. Всё семейство 2005-2013 удобнее ставить набором TechPowerUp или abbodi1406 в «Классических скриптах»: там есть и 2012, которого в WinGet нет вовсе."
    tooltip: "Official Microsoft packages for the 2015+ (v14) runtime, x86 and x64."
    tooltip_ru: "Официальные пакеты Microsoft для рантайма 2015+ (v14), x86 и x64."
    default: []
    options:
      - value: "Microsoft.VCRedist.2015+.x86"
        label: "MSVC 2015+ x86"
        label_ru: "MSVC 2015+ x86"
      - value: "Microsoft.VCRedist.2015+.x64"
        label: "MSVC 2015+ x64"
        label_ru: "MSVC 2015+ x64"

  - id: packages_msvc_legacy
    type: "checkboxes"
    label: "Advanced: MSVC 2005-2013"
    label_ru: "Advanced: MSVC 2005-2013"
    hint: "Official Microsoft packages, one per year and architecture. Recommended instead: the all-in-one bundles from TechPowerUp or abbodi1406 in Classic scripts - one pass, and they include 2012, which has no WinGet package."
    hint_ru: "Официальные пакеты Microsoft, по одному на год и разрядность. Рекомендуем вместо них all-in-one наборы TechPowerUp или abbodi1406 в «Классических скриптах»: одним заходом и вместе с 2012, для которого пакета в WinGet не существует."
    tooltip: "Legacy runtimes for old software. WinGet manifests here are frozen at the final vendor build, so they never report an update."
    tooltip_ru: "Старые рантаймы для древнего софта. Манифесты WinGet здесь заморожены на финальной сборке вендора, поэтому обновления по ним не приходят никогда."
    default: []
    options:
      - value: "Microsoft.VCRedist.2013.x86"
        label: "MSVC 2013 x86"
        label_ru: "MSVC 2013 x86"
      - value: "Microsoft.VCRedist.2013.x64"
        label: "MSVC 2013 x64"
        label_ru: "MSVC 2013 x64"
      - value: "Microsoft.VCRedist.2010.x86"
        label: "MSVC 2010 x86"
        label_ru: "MSVC 2010 x86"
      - value: "Microsoft.VCRedist.2010.x64"
        label: "MSVC 2010 x64"
        label_ru: "MSVC 2010 x64"
      - value: "Microsoft.VCRedist.2008.x86"
        label: "MSVC 2008 x86"
        label_ru: "MSVC 2008 x86"
      - value: "Microsoft.VCRedist.2008.x64"
        label: "MSVC 2008 x64"
