    title: "Vendor Downloads"
    title_ru: "Загрузки от вендоров"
    description: "DaVinci Resolve, Affinity, NVIDIA drivers and tools, Windows images with updates inside: every published version straight from the source, each build into its own folder."
    description_ru: "DaVinci Resolve, Affinity, драйверы и программы NVIDIA, образы Windows с обновлениями внутри: все выпущенные версии прямо от источника, каждая сборка в свою папку."
