          - {op: vendor_download, icon: download, guests: [{op: vendor_link, icon: external-link}]}

# What to do with a downloaded archive is decided once, not page by page.
shared:
  - vendor_extract
  - vendor_delete_zip
  - vendor_flat

# The operations of the program itself: small buttons of the header. "GitHub token" asks for its
# value in a dialog before it runs (`prompt` of its parameters in the manifest).
service:
  - {op: github_token, icon: key-round}
  - {op: github_token_status, icon: gauge}
  - {op: health_doctor, icon: shield-check}
  - {op: validate_config_lists, icon: check-check}
  - {op: cleanup_logs, icon: eraser}

# The operations of the working folders of the program: buttons beside the row DOWNLOADS. They
# run without --source and --target - on `input` and `output` of the program itself, whatever
# folder the downloads go to - and the question before one names both folders by their full paths.
folders:
  - {op: cleanup_input_output, icon: trash-2, tone: burn}

# Operations whose place in the window is not built yet, each with the reason.
pending: {}

# Operations of the manifest the window does not carry. Portable browsers, the six that stood
# here, left the manifest with 3.0.0.
#   update_winget_self - "Update WinGet (script)": the classic script WinGet-Update.cmd does what the
#     button "Update WinGet" on WINGET -> Updates does (winget upgrade of Microsoft.AppInstaller). The
#     plan of the window merged the two into that button; until 12.10.2026 the second one stood on
#     SYSTEM -> WinUtil, a page it has nothing to do with. The script stays with the console menu.
retired: [update_winget_self]
