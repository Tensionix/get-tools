# Where every operation stands in the window on Avalonia.
#
# config\tool_manifest.yaml says what an operation is: its service, its fields, its texts.
# This file says where it stands: a section (a large button under the header), a page of the
# section (the row under the sections), a card of the page. The console door hands it to the
# window with `describe`.
#
#   cards:   a card is one operation with its form; `guests` are operations whose buttons stand
#            in the same card and read the same fields
#   fixed:   values the page sets by itself - the fields named are not drawn, and every list,
#            condition and run of the page sees these values
#   form:    "none" - the operation runs on its defaults, its fields are not drawn
#   choices: a row of switches over the form of a page, one of them on: each names the values the
#            page fixes while it is on (`values`), as `fixed` does for good; `choose` names the function
#            that says which of them a page opens on ("module:function", it gets the choices) - none
#            named, or nothing answered: the first
#   groups:  the blocks of the form of the card in the order they stand in - the names the manifest
#            gives them in `section`; a block not named stands after them, as its fields come
#   about:   what a section or a page is for - the second line of the tooltip of its button
#   icon:    a name of the icon set of the window (Source\Tools\build_icons.py)
#   tone:    "run" - the main action of its card, a filled button; "burn" - it removes
#   source:  true - the operations of the page read a folder the person may choose (the JSON of
#            an import, driver packages for the image): the page shows the row SOURCE over its form,
#            and the window names the folder to the door (--source)
#   filter:  true - the page has one search for all its lists, in the bar over the cards: a
#            catalogue of two hundred packages in fifteen groups
#   shared:  the fields whose value is one for the whole window. Every other field belongs to its
#            page: what is set on one page is not seen on another, even when both draw the same form
#
# An operation of the manifest that stands nowhere here must be named in `service`, `folders`,
# `pending` or `retired` - tests\test_cli_door.py counts them.

sections:
  - id: winget
    title: "WINGET"
    about: "Packages: install, update, pin, remove"
    about_ru: "Пакеты: поставить, обновить, убрать"
    icon: package
    pages:
      - id: catalogue
        filter: true
        title: "Catalogue"
        title_ru: "Каталог"
        icon: layout-grid
        cards:
          - op: check_selected_packages
            icon: scan-search
            guests:
              - {op: install_selected_packages, icon: package-plus, tone: run}
              - {op: update_selected_packages, icon: refresh-cw}
      - id: updates
        title: "Updates"
        title_ru: "Обновления"
        icon: refresh-cw
        cards:
          - {op: preview_available_updates, icon: list, block: "What is new", block_ru: "Что нового"}
          - {op: update_all_available_packages, icon: check-check, block: "What is new", block_ru: "Что нового"}
          - {op: update_app_installer, icon: package, block: "What is new", block_ru: "Что нового"}
          - {op: update_available_packages, icon: refresh-cw, tone: run, block: "Pick and update", block_ru: "Выбрать и обновить"}
      - id: installed
        filter: true
        title: "Installed"
        title_ru: "Установлено"
        icon: hard-drive
        cards:
          - {op: uninstall_selected_installed_packages, icon: trash-2, tone: burn, block: "Remove", block_ru: "Удалить"}
          - {op: pin_selected_packages, icon: pin, tone: run, block: "Pins", block_ru: "Закрепления"}
      - id: by_id
        title: "By ID"
        title_ru: "По ID"
        icon: search
        cards:
          - {op: search_winget, icon: search, block: "Search", block_ru: "Поиск"}
          - op: install_package_by_id
            icon: package-plus
            tone: run
            block: "One package"
            block_ru: "Один пакет"
          - {op: uninstall_package_by_id, icon: trash-2, tone: burn, block: "One package", block_ru: "Один пакет"}
          - {op: add_package_to_list, icon: list, block: "Into the catalogue", block_ru: "В каталог"}
      - id: ai
        title: "AI"
        title_ru: "AI"
        icon: sparkles
        cards:
          - op: ai_plan_packages
            icon: sparkles
            tone: run
            block: "Plan"
            block_ru: "План"
            # The owner, 11.10.2026: "the prompt up, then the instruction, and only then the models and the effort".
            groups: [request, prompt, provider, generation]
            guests:
              - {op: ai_check_model, icon: scan-search}
              - {op: ai_pin_api_key, icon: pin}
              - {op: ai_pin_model, icon: pin}
              - {op: ai_save_prompt, icon: file-text}
          - {op: ai_run_selected_plan_packages, icon: play, block: "From the plan", block_ru: "Из плана"}
          - {op: ai_search_winget, icon: search, block: "Exact ID", block_ru: "Точный ID"}
          - {op: ai_add_exact_package_to_list, icon: list, block: "Exact ID", block_ru: "Точный ID"}
          # One WinGet ID, three things to do with it: one card, not three with the same field.
          - op: ai_install_exact_package
            icon: package-plus
            block: "Exact ID"
            block_ru: "Точный ID"
            guests:
              - {op: ai_update_exact_package, icon: refresh-cw}
              - {op: ai_uninstall_exact_package, icon: trash-2, tone: burn}
      - id: transfer
        source: true
        title: "Transfer"
        title_ru: "Перенос"
        icon: arrow-left-right
        cards:
          - {op: export_winget, icon: upload, tone: run, block: "From this machine", block_ru: "С этой машины"}
          - {op: import_winget, icon: download, tone: run, block: "Onto this machine", block_ru: "На эту машину"}

